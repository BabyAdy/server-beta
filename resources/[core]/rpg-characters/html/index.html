<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPG · Character Creator</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div id="cc" class="hidden">
        <aside class="panel">
            <header class="p-head">
                <div class="title">Creare personaj</div>
                <div class="who">Cont: <b id="cc-user">—</b></div>
            </header>

            <nav class="tabs" id="cc-tabs"></nav>

            <div class="p-body" id="cc-body"></div>

            <footer class="p-foot">
                <button class="btn btn-ghost" id="cc-random">Aleatoriu</button>
                <button class="btn btn-primary" id="cc-confirm">
                    <span class="label">Confirmă</span>
                    <span class="spinner"></span>
                </button>
            </footer>
        </aside>

        <div class="stage">
            <button class="rot" data-rot="-1" aria-label="Rotește stânga">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18 9 12l6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="zoom" id="cc-zoom">
                <button data-zoom="head">Cap</button>
                <button data-zoom="body" class="on">Corp</button>
                <button data-zoom="legs">Picioare</button>
            </div>
            <button class="rot" data-rot="1" aria-label="Rotește dreapta">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>

        <div class="toasts" id="cc-toasts"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
