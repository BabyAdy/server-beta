<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rpg-drivingschool</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="quiz" class="hidden">
    <div class="card">
      <div class="head">
        <div class="brand">DRIVING SCHOOL · TEST TEORETIC</div>
        <div class="qcount"><span id="q-num">1</span>/<span id="q-total">5</span></div>
      </div>

      <div class="prog"><div id="prog-fill" class="prog-fill"></div></div>

      <div class="qtext" id="q-text">—</div>

      <div class="answers" id="q-answers"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
