<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rpg-duty</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap" class="hidden">
    <div id="panel">
      <header>
        <div>
          <div class="kicker">Factiune</div>
          <h1>OUTFIT DE SERVICIU</h1>
        </div>
        <button id="btn-cancel" title="Renunță (ESC)">✕</button>
      </header>

      <p class="hint">Derulează drawable (D) și textura (T) pentru fiecare piesă până obții
        uniforma dorită, apoi apasă <b>Salvează</b>. Outfit-ul se aplică automat când folosești <b>/duty</b>.</p>

      <div id="rows"></div>

      <footer>
        <button class="btn ghost" id="btn-reset">Renunță</button>
        <button class="btn primary" id="btn-save">Salvează outfit</button>
      </footer>
    </div>
  </div>
  <div id="toasts"></div>
  <script src="script.js"></script>
</body>
</html>
