<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rpg-garages</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- ============================ PROMPT (jos-centru) ==================== -->
    <div id="prompt" class="hidden">
        <div class="p-key"><span>E</span></div>
        <div class="p-body">
            <div class="p-title" id="p-title">GARAGE ACCESS</div>
            <div class="p-sub" id="p-sub">Press E to access your vehicle list!</div>
        </div>
    </div>

    <!-- ============================ MODAL ================================= -->
    <div id="overlay" class="hidden">
        <div id="modal" role="dialog" aria-modal="true">
            <header class="m-head">
                <div class="m-titles">
                    <div class="m-kicker" id="m-kicker">GARAGE #0</div>
                    <h1 class="m-title" id="m-title">VEHICLES</h1>
                </div>
                <button id="m-close" class="m-x" title="Close (ESC)" aria-label="Close">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </header>

            <div class="m-tools" id="m-tools">
                <label class="m-search">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                    <input id="m-search-input" type="text" placeholder="Search vehicles..." autocomplete="off" spellcheck="false" />
                </label>
                <div class="m-sort">
                    <select id="m-sort" aria-label="Sort by">
                        <option value="id-asc">Sort: ID</option>
                        <option value="name-asc">Name (A–Z)</option>
                        <option value="odo-desc">Odometer ↓</option>
                        <option value="fuel-desc">Fuel ↓</option>
                        <option value="new">Newest</option>
                        <option value="old">Oldest</option>
                    </select>
                    <svg class="m-sort-caret" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
                </div>
            </div>

            <div class="m-scroll">
                <div class="m-list" id="m-list"></div>
                <div class="m-empty hidden" id="m-empty">
                    <div class="e-icon">
                        <svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6.5 17l1.2-4.8A2 2 0 0 1 9.6 11h4.8a2 2 0 0 1 1.9 1.2L17.5 17M7 17v2M17 17v2M4 11h16"/></svg>
                    </div>
                    <div class="e-title" id="e-title">NO VEHICLES</div>
                    <div class="e-sub" id="e-sub">You don't have any vehicles available in this garage.</div>
                </div>
            </div>

            <footer class="m-foot">
                <span class="m-count" id="m-count">0 vehicles</span>
                <button id="m-esc-btn" class="m-esc"><kbd>ESC</kbd> Close</button>
            </footer>
        </div>
    </div>

    <!-- ============================ TOASTS =============================== -->
    <div id="toasts"></div>

    <script src="js/app.js"></script>
</body>
</html>
