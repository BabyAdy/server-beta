<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rpg-housing</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="houses"></div>

  <div id="prompt" class="hidden">
    <span class="key">E</span>
    <span class="lbl" id="prompt-text">for enter home</span>
  </div>

  <!-- ===================== popup /buyhouse ===================== -->
  <div id="buy" class="hidden">
    <div class="buy-box">
      <!-- pas 1: confirmare -->
      <section id="buy-confirm">
        <div class="buy-kicker">Achiziție locuință</div>
        <p class="buy-text" id="buy-confirm-text"></p>
        <p class="buy-q">Dorești să continui tranzacția?</p>
        <div class="buy-row">
          <button class="bbtn bbtn-yes" id="buy-yes">Yes</button>
          <button class="bbtn bbtn-no"  id="buy-no">No</button>
        </div>
      </section>

      <!-- pas 2: metoda de plata -->
      <section id="buy-method" class="hidden">
        <div class="buy-kicker">Metodă de plată</div>
        <p class="buy-text">De unde dorești să îți fie retrase fondurile pentru achiziție?</p>
        <div class="buy-row">
          <button class="bbtn bbtn-pay" id="pay-cash">
            <span class="dot" id="dot-cash"></span><span>Cash</span>
            <em class="pay-amt" id="amt-cash"></em>
          </button>
          <button class="bbtn bbtn-pay" id="pay-bank">
            <span class="dot" id="dot-bank"></span><span>Bank</span>
            <em class="pay-amt" id="amt-bank"></em>
          </button>
        </div>
        <button class="bbtn bbtn-cancel" id="buy-cancel">Anulează</button>
      </section>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
