<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPG · Inventar</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div id="inv" class="hidden">
        <div class="scrim"></div>

        <div class="layout">
            <!-- ================= LEFT : ECHIPAMENT + PERSONAJ ================= -->
            <section class="col col-left">
                <h2 class="col-title">Echipament</h2>
                <div class="char-view" id="char-view">
                    <div class="eq" style="--x:50%;--y:6%"  data-eq="hat"></div>
                    <div class="eq" style="--x:22%;--y:24%" data-eq="mask"></div>
                    <div class="eq" style="--x:78%;--y:24%" data-eq="glasses"></div>
                    <div class="eq" style="--x:22%;--y:55%" data-eq="shirt"></div>
                    <div class="eq" style="--x:78%;--y:55%" data-eq="armor"></div>
                    <div class="eq" style="--x:22%;--y:82%" data-eq="pants"></div>
                    <div class="eq" style="--x:78%;--y:82%" data-eq="shoes"></div>
                </div>
            </section>

            <!-- ================= CENTER : INVENTAR ================= -->
            <section class="col col-mid">
                <div class="inv-head">
                    <h2 class="col-title">Inventar</h2>
                    <div class="capacity">
                        <div class="cap-nums">
                            <span id="cap-cur">0</span> / <span id="cap-max">0</span>
                            <span class="cap-unit">sloturi</span>
                        </div>
                        <div class="cap-bar"><i id="cap-fill"></i></div>
                    </div>
                </div>

                <div class="search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
                    <input id="inv-search" type="text" placeholder="Caută articole..." autocomplete="off" spellcheck="false" />
                </div>

                <div class="grid" id="inv-grid"></div>

                <div class="fast">
                    <h3 class="sub-title">Sloturi rapide</h3>
                    <div class="fast-row" id="fast-row"></div>
                </div>
            </section>

            <!-- ================= RIGHT : NEARBY + DROP ================= -->
            <section class="col col-right">
                <h2 class="col-title">În apropiere</h2>
                <div class="grid grid-nearby" id="nearby-grid"></div>

                <div class="dropzone" id="dropzone">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m-9 4v6m4-6v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>Aruncă articole aici</span>
                </div>
            </section>

            <button class="inv-close" id="inv-close" aria-label="Închide">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12" stroke-linecap="round"/></svg>
            </button>
        </div>

        <div class="tooltip" id="tooltip"></div>
        <div class="ctxmenu" id="ctxmenu"></div>

        <div class="modal-scrim" id="modal-scrim">
            <div class="modal" id="modal"></div>
        </div>

        <div class="toasts" id="inv-toasts"></div>
    </div>

    <script src="js/dnd.js"></script>
    <script src="js/tooltip.js"></script>
    <script src="js/contextmenu.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/equipment.js"></script>
    <script src="js/nearby.js"></script>
    <script src="js/fastslots.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
