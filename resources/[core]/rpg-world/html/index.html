<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rpg-world</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="nc-bar" class="hidden">
    <div class="grp">
      <span class="key">F2</span>
      <span class="lbl">Toggle NoClip</span>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <span class="key">W</span><span class="key">S</span>
      <span class="lbl">Front / Back</span>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <span class="key">A</span><span class="key">D</span>
      <span class="lbl">Left / Right</span>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <span class="key">Q</span><span class="key">E</span>
      <span class="lbl">Up / Down</span>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <span class="key wide">L SHIFT</span>
      <span class="lbl">Speed <b id="nc-speed">Normal</b></span>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
