# ==========================================================
#  PURPLE HAVOC - RPG SERVER
#  server.cfg  (pornire prin txAdmin)
# ==========================================================

# ----------------------------------------------------------
#  Retea
# ----------------------------------------------------------
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_maxclients 8

# ----------------------------------------------------------
#  OneSync
# ----------------------------------------------------------
## OneSync se activeaza din txAdmin > Settings > FXServer  (Sync = "on").
## Lasa linia comentata cat timp folosesti txAdmin - altfel primesti warning.
## rpg-auth si majoritatea sistemelor de framework au NEVOIE de OneSync ON.
# onesync on

# ----------------------------------------------------------
#  Identitate
# ----------------------------------------------------------
sv_hostname "Purple Havoc | RPG | WIP"
sets sv_projectName "Purple Havoc"
sets sv_projectDesc "GTA V RPG server - progression, levels, skills"
sets tags "rpg, progression, romania, roleplay"
sets locale "ro-RO"

# Build-ul de joc (3407 = DLC-ul din 2024). Scade la 2699 daca vrei ceva mai usor.
sv_enforceGameBuild 3788

# Anti-cheat minim
sv_scriptHookAllowed 0

# ----------------------------------------------------------
#  DE COMPLETAT (tu)
# ----------------------------------------------------------
# ATENTIE: cheia postata in chat trebuie REGENERATA pe https://keymaster.fivem.net/
sv_licenseKey "PUNE_CHEIA_NOUA_AICI"

# Optional (lasa comentat daca nu ai cheie Steam)
# set steam_webApiKey ""

# String-ul de conexiune MySQL (oxmysql)
# Creeaza baza "purple_havoc" si importa resources/[core]/rpg-auth/sql/rpg_auth.sql
set mysql_connection_string "mysql://root:@localhost/rpg_server?charset=utf8mb4"

# ----------------------------------------------------------
#  Permisiuni
# ----------------------------------------------------------
add_ace group.admin command allow
add_ace group.admin ph.admin allow
# Pune-ti identificatorul tau ca sa ai acces admin (ia-l cu "status" in consola)
# add_principal identifier.fivem:0000000 group.admin

# ==========================================================
#  RESURSE
# ==========================================================

# ---- Dependinta ----
ensure oxmysql

# ---- Interioare MLO (case, apartamente, mansion-uri...) folosite de rpg-housing ----
ensure bob74_ipl

# ---- vMenu (trainer admin) ----
ensure vMenu
exec resources/vMenu/config/permissions.cfg

# grup dedicat cu acces TOTAL in vMenu (inclusiv functiile dezactivate implicit,
# prin flag-ul propriu al vMenu "vMenu.Everything"). Apartenenta se acorda DINAMIC
# de rpg-auth (server/main.lua -> vmenuApply) pt. users.id = 1 si staff >= manager.
add_ace group.rpg_vmenu_full "vMenu.Everything" allow

# ---- Vehicule addon: FIECARE masina e propria resursa in resources/[cars]/
# (vezi comentariul din resources/[cars]/nkcypher/__resource.lua pt. sablon).
# Adauga cate un "ensure numemasina" aici pentru fiecare masina noua.
ensure chironsupersport22
ensure gemera
ensure nkbf400
ensure nkcomet6
ensure nkcypher
ensure nkdominator3
ensure nkjester4
ensure nknovak
ensure nkstingertt
ensure nkvolito
ensure nktenf
ensure s790

# ---- Inlocuire haine default (streamed replacement) — resources/[clothing]/rpg-clothing/ ----
ensure rpg-clothing

# ---- Core-ul Purple Havoc ----
ensure [core]

# ---- Autentificare (Login / Register NUI) ----
ensure rpg-auth

# ---- Lume: fara NPC/trafic ambiental + NoClip staff (F2 / trialadmin+) ----
ensure rpg-world

# ---- Character Creator (un personaj / cont) ----
ensure rpg-characters

# ---- Inventory (modular, server-authoritative, NUI custom) ----
ensure rpg-inventory

# ---- Chat + HUD + Speedometer (NUI custom) ----
# rpg-hud INLOCUIESTE resursa `chat` default -> NU adauga `ensure chat`.
ensure rpg-hud

# ---- Licente pe ore (driving/weapon/flying/sailing) + /agl ----
# ensure DUPA rpg-auth/rpg-characters/rpg-hud (le foloseste prin exports).
# rpg-inventory o foloseste optional la echiparea armelor (apel fail-open, deci ordinea
# fata de rpg-inventory nu e critica).
ensure rpg-licences

# ---- Level & Respect Points + /stats (economie pe users) ----
# ensure DUPA rpg-hud: rpg-level e autoritatea pt. money/bank/level si trimite spre HUD.
ensure rpg-level

# ---- Tichete / Report (meniu player + meniu staff NUI) ----
# ensure DUPA rpg-auth/rpg-characters/rpg-hud/rpg-level (le foloseste prin exports).
ensure rpg-tickets

# ---- Driving School Center (test teoretic NUI + test practic pe checkpoint-uri) ----
# ensure DUPA rpg-level (costul de $100) si rpg-licences (acordarea Driving Licence).
ensure rpg-drivingschool

# ---- Case / interioare (creare cu /createhouse, staff >= manager) ----
# ensure DUPA rpg-auth/rpg-characters/rpg-hud. Interioarele fizice vin din bob74_ipl.
ensure rpg-housing

# ---- Vehicule personale (/park, /v, /vcreate, /vdelete) ----
# ensure DUPA rpg-auth/rpg-characters/rpg-hud.
ensure rpg-vehicles
