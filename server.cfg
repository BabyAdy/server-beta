# ==========================================================
#  PURPLE HAVOC - RPG SERVER
#  server.cfg  (pornire prin txAdmin)
# ==========================================================

# ----------------------------------------------------------
#  Retea
# ----------------------------------------------------------
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_maxclients 8

# ----------------------------------------------------------
#  OneSync
# ----------------------------------------------------------
## OneSync se activeaza din txAdmin > Settings > FXServer  (Sync = "on").
## Lasa linia comentata cat timp folosesti txAdmin - altfel primesti warning.
## rpg-auth si majoritatea sistemelor de framework au NEVOIE de OneSync ON.
# onesync on

# ----------------------------------------------------------
#  Identitate
# ----------------------------------------------------------
sv_hostname "Purple Havoc | RPG | WIP"
sets sv_projectName "Purple Havoc"
sets sv_projectDesc "GTA V RPG server - progression, levels, skills"
sets tags "rpg, progression, romania, roleplay"
sets locale "ro-RO"

# Build-ul de joc (3407 = DLC-ul din 2024). Scade la 2699 daca vrei ceva mai usor.
sv_enforceGameBuild 3407

# Anti-cheat minim
sv_scriptHookAllowed 0

# ----------------------------------------------------------
#  DE COMPLETAT (tu)
# ----------------------------------------------------------
# ATENTIE: cheia postata in chat trebuie REGENERATA pe https://keymaster.fivem.net/
sv_licenseKey "PUNE_CHEIA_NOUA_AICI"

# Optional (lasa comentat daca nu ai cheie Steam)
# set steam_webApiKey ""

# String-ul de conexiune MySQL (oxmysql)
# Creeaza baza "purple_havoc" si importa resources/[core]/rpg-auth/sql/rpg_auth.sql
set mysql_connection_string "mysql://root:@localhost/rpg_server?charset=utf8mb4"

# ----------------------------------------------------------
#  Permisiuni
# ----------------------------------------------------------
add_ace group.admin command allow
add_ace group.admin ph.admin allow
# Pune-ti identificatorul tau ca sa ai acces admin (ia-l cu "status" in consola)
# add_principal identifier.fivem:0000000 group.admin

# ==========================================================
#  RESURSE
# ==========================================================

# ---- Dependinta ----
ensure oxmysql

# ---- Core-ul Purple Havoc ----
ensure [core]

# ---- Autentificare (Login / Register NUI) ----
ensure rpg-auth

# ---- Character Creator (un personaj / cont) ----
ensure rpg-characters

# ---- Inventory (modular, server-authoritative, NUI custom) ----
ensure rpg-inventory

# ---- Chat + HUD + Speedometer (NUI custom) ----
# rpg-hud INLOCUIESTE resursa `chat` default -> NU adauga `ensure chat`.
ensure rpg-hud
